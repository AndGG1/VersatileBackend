name: Spring Boot CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and checks
        run: ./gradlew check
        env:
          REDIS_ENDPOINT: rediss://red-d9jog0cm0tmc73bdo9ig:UqpXJ6S9kI84Rva7DiSHtfJ1iM9yGZ4Q@frankfurt-keyvalue.render.com:6379
